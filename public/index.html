<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Procare Check-in</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 20px;
        }
        
        .container {
            max-width: 500px;
            margin: 0 auto;
            width: 100%;
        }
        
        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }
        
        .header h1 {
            font-size: 28px;
            margin-bottom: 10px;
        }
        
        .header p {
            opacity: 0.9;
            font-size: 16px;
        }
        
        .card {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }
        
        .input-group {
            margin-bottom: 20px;
        }
        
        .input-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
        }
        
        .input-group input {
            width: 100%;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            transition: border-color 0.3s;
        }
        
        .input-group input:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .btn {
            width: 100%;
            padding: 18px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
        }
        
        .btn:active {
            transform: scale(0.98);
        }
        
        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        
        .btn-secondary {
            background: #6c757d;
            margin-top: 10px;
        }
        
        .status {
            margin-top: 20px;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            font-weight: 500;
            display: none;
        }
        
        .status.success {
            background: #d4edda;
            color: #155724;
            display: block;
        }
        
        .status.error {
            background: #f8d7da;
            color: #721c24;
            display: block;
        }
        
        .status.loading {
            background: #fff3cd;
            color: #856404;
            display: block;
        }
        
        .students-list {
            margin-top: 20px;
        }
        
        .student-btn {
            width: 100%;
            padding: 15px;
            background: #f8f9fa;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            margin-bottom: 10px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .student-btn:hover {
            background: #e9ecef;
            border-color: #667eea;
        }
        
        .student-btn:active {
            transform: scale(0.98);
        }
        
        .history {
            margin-top: 20px;
        }
        
        .history h3 {
            margin-bottom: 15px;
            color: #333;
        }
        
        .history-item {
            padding: 12px;
            background: #f8f9fa;
            border-radius: 8px;
            margin-bottom: 10px;
            font-size: 14px;
        }
        
        .history-item strong {
            display: block;
            margin-bottom: 5px;
        }
        
        .history-item span {
            color: #666;
            font-size: 12px;
        }
        
        .icon {
            font-size: 48px;
            text-align: center;
            margin-bottom: 20px;
        }
        
        .tab-buttons {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        
        .tab-btn {
            flex: 1;
            padding: 12px;
            background: #f8f9fa;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .tab-btn.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .tab-content {
            display: none;
        }
        
        .tab-content.active {
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📱 Student Check-in</h1>
            <p>Quick and easy attendance</p>
        </div>
        
        <div class="card">
            <div class="tab-buttons">
                <button class="tab-btn active" onclick="switchTab('students')">Students</button>
                <button class="tab-btn" onclick="switchTab('manual')">Manual</button>
            </div>
            
            <div id="studentsTab" class="tab-content active">
                <div class="icon">👥</div>
                <div id="studentsList" class="students-list"></div>
            </div>
            
            <div id="manualTab" class="tab-content">
                <div class="icon">🔑</div>
                <div class="input-group">
                    <label for="rfidInput">NFC Tag ID / Serial Number:</label>
                    <input type="text" id="rfidInput" placeholder="Paste or type tag ID">
                </div>
                <button class="btn" onclick="manualCheckin()">Check In</button>
            </div>
            
            <div id="status" class="status"></div>
        </div>
        
        <div class="card">
            <div class="history">
                <h3>Recent Check-ins</h3>
                <div id="historyList"></div>
            </div>
        </div>
    </div>
    
    <script>
        let students = {};
        
        // Load students from server
        async function loadStudents() {
            try {
                const response = await fetch('/api/students');
                const data = await response.json();
                students = data.students;
                
                const studentsList = document.getElementById('studentsList');
                studentsList.innerHTML = Object.entries(students).map(([id, student]) => `
                    <button class="student-btn" onclick="checkinByName('${student.name}')">
                        ${student.name}
                    </button>
                `).join('');
            } catch (error) {
                console.error('Failed to load students:', error);
            }
        }
        
        // Switch tabs
        function switchTab(tab) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
            
            if (tab === 'students') {
                document.querySelector('.tab-btn:first-child').classList.add('active');
                document.getElementById('studentsTab').classList.add('active');
            } else {
                document.querySelector('.tab-btn:last-child').classList.add('active');
                document.getElementById('manualTab').classList.add('active');
            }
        }
        
        // Load history
        function loadHistory() {
            const history = JSON.parse(localStorage.getItem('checkinHistory') || '[]');
            const historyList = document.getElementById('historyList');
            historyList.innerHTML = history.length === 0 
                ? '<p style="color: #999; text-align: center;">No check-ins yet</p>'
                : history.map(item => `
                    <div class="history-item">
                        <strong>${item.student}</strong>
                        <span>${item.time}</span>
                    </div>
                `).join('');
        }
        
        function addToHistory(student, time) {
            const history = JSON.parse(localStorage.getItem('checkinHistory') || '[]');
            history.unshift({ student, time });
            if (history.length > 10) history.pop();
            localStorage.setItem('checkinHistory', JSON.stringify(history));
            loadHistory();
        }
        
        function showStatus(message, type) {
            const statusDiv = document.getElementById('status');
            statusDiv.textContent = message;
            statusDiv.className = `status ${type}`;
        }
        
        // Check in by student name (from button)
        async function checkinByName(studentName) {
            showStatus('Processing check-in...', 'loading');
            
            // Find the RFID for this student
            const rfidId = Object.keys(students).find(id => students[id].name === studentName);
            
            if (!rfidId) {
                showStatus('❌ Student not found', 'error');
                return;
            }
            
            await performCheckin(rfidId);
        }
        
        // Manual check-in
        async function manualCheckin() {
            const rfidInput = document.getElementById('rfidInput');
            const rfidId = rfidInput.value.trim();
            
            if (!rfidId) {
                showStatus('❌ Please enter an NFC tag ID', 'error');
                return;
            }
            
            await performCheckin(rfidId);
            rfidInput.value = '';
        }
        
        // Perform check-in API call
        async function performCheckin(rfidId) {
            try {
                const response = await fetch('/api/checkin', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ rfidId })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    showStatus(`✅ ${data.student} checked in at ${data.time}`, 'success');
                    addToHistory(data.student, new Date().toLocaleString());
                    
                    // Vibrate if supported
                    if ('vibrate' in navigator) {
                        navigator.vibrate(200);
                    }
                } else {
                    showStatus(`❌ ${data.error || 'Check-in failed'}`, 'error');
                }
            } catch (error) {
                showStatus(`❌ Network error: ${error.message}`, 'error');
            }
        }
        
        // Initialize
        loadStudents();
        loadHistory();
    </script>
</body>
</html>
