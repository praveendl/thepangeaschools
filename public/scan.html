<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Processing...</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            text-align: center;
            padding: 20px;
        }
        .loader {
            font-size: 48px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div>
        <div class="loader">⏳</div>
        <h2>Processing check-in...</h2>
    </div>
    
    <script>
        // Get RFID from URL parameter
        const params = new URLSearchParams(window.location.search);
        const rfidId = params.get('id');
        
        if (rfidId) {
            // Add timestamp to prevent caching
            const timestamp = new Date().getTime();
            window.location.href = `/api/checkin/${rfidId}?t=${timestamp}`;
        } else {
            document.body.innerHTML = '<div><h1>❌ Error</h1><p>No RFID specified</p></div>';
        }
    </script>
</body>
</html>
